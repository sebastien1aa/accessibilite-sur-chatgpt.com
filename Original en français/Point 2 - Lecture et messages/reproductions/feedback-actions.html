<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Contrôles publics des annonces 3.5.6</title>
<script src="../../../extension/feedback-actions.js"></script></head>
<body><h1>Contrôles publics : partage et copie</h1>
<p>Contenu fictif uniquement. Ces contrôles DOM ne prouvent pas la parole JAWS.</p>
<button id="run">Exécuter les contrôles</button><button id="ax-prepare">Préparer contrôle AX</button><button id="sender-ax-prepare">Préparer AX message envoyé</button><pre id="results"></pre><div id="fixture"></div>
<script>
const marker=Symbol.for('chatgpt-navigation-continue.feedback-actions.v7');
const status=()=>document.querySelector('[data-chatgpt-a11y-action-status]');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const title='Le lien public a été copié.';
const privacy='Toute personne disposant du lien peut consulter cette conversation.';
let source;
function toast(description=true) {
  const node=document.createElement('li');node.setAttribute('data-sonner-toast','');node.setAttribute('data-visible','true');
  const text=document.createElement('div');text.setAttribute('data-title','');text.textContent=title+(description?privacy:'');node.append(text);document.getElementById('fixture').append(node);return node;
}
async function setup() {
  window[marker]?.stop();
  document.getElementById('fixture').innerHTML='<header><button type="button" aria-label="Partager">Partager</button></header><article data-turn-key="synthetic"><button type="button" aria-label="Copier"><svg width="21" height="21" viewBox="0 0 21 21"><path d="M3 3h12v12H3z"/></svg></button><button type="button" aria-label="Copier le message"><svg width="21" height="21" viewBox="0 0 21 21"><path d="M3 3h12v12H3z"/></svg></button></article><button id="other">Autre</button>';
  (0,eval)(source);
  const share=document.querySelector('header button');
  const copies=[...document.querySelectorAll('article button')];
  return {share,copies,other:document.getElementById('other')};
}
function icon(){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 21 21');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M3 10l5 5L18 3');svg.append(path);return svg;}
async function successfulCopy(button) {button.focus();button.addEventListener('click',()=>{button.setAttribute('aria-label','Copié');button.replaceChildren(icon());},{once:true});button.click();await wait(550);}
async function startShare(button) {button.focus();button.addEventListener('click',()=>{button.setAttribute('disabled','');},{once:true});button.click();await wait(30);}
async function finishShare(button,description=true) {button.removeAttribute('disabled');toast(description);await wait(30);}
document.getElementById('run').addEventListener('click',async()=>{
  source=await fetch('../../../extension/feedback-actions.js').then(r=>r.text());
  const results=[];
  async function check(name,fn) {try {results.push({name,ok:!!await fn()});}catch(error){results.push({name,ok:false,error:String(error)});}}
  await check('région vide montée avant action',async()=>{const c=await setup();return status().getAttribute('role')==='status'&&status().textContent==='';});
  await check('copie modèle confirmée, focus natif conservé',async()=>{const c=await setup();await successfulCopy(c.copies[0]);return status().textContent==='Message copié'&&document.activeElement===c.copies[0];});
  await check('copie utilisateur confirmée',async()=>{const c=await setup();await successfulCopy(c.copies[1]);return status().textContent==='Message copié';});
  await check('échec copie reste silencieux',async()=>{const c=await setup();c.copies[0].focus();c.copies[0].click();await wait(30);return status().textContent==='';});
  await check('aucun blur/BODY pendant la désactivation et deux phrases',async()=>{const c=await setup();let losses=0;c.share.addEventListener('focusout',()=>losses++);await startShare(c.share);const retained=document.activeElement===c.share&&c.share.disabled&&!c.share.hasAttribute('disabled')&&c.share.getAttribute('aria-disabled')==='true';await finishShare(c.share);return retained&&losses===0&&document.activeElement===c.share&&status().textContent===title+' '+privacy;});
  await check('toast antérieur ignoré',async()=>{const c=await setup();toast();await startShare(c.share);c.share.disabled=false;await wait(30);return status().textContent==='';});
  await check('absence explication respectée',async()=>{const c=await setup();await startShare(c.share);await finishShare(c.share,false);return status().textContent===title;});
  await check('focus externe puis BODY ne rend pas le bail',async()=>{const c=await setup();await startShare(c.share);c.other.focus();c.other.blur();await finishShare(c.share);return document.activeElement===document.body;});
  await check('navigation Tab non annulée, pas de retour forcé',async()=>{const c=await setup();await startShare(c.share);const event=new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true});c.share.dispatchEvent(event);await finishShare(c.share);return !event.defaultPrevented&&document.activeElement===c.share;});
  await check('copie répétée produit une nouvelle mutation de status',async()=>{const c=await setup();await successfulCopy(c.copies[0]);let mutations=0;const observer=new MutationObserver(()=>mutations++);observer.observe(status(),{childList:true});c.copies[0].setAttribute('aria-label','Copier');await successfulCopy(c.copies[0]);observer.disconnect();return mutations>=2&&status().textContent==='Message copié';});
  await check('évènement history annule livraison même URL',async()=>{const c=await setup();c.copies[0].focus();c.copies[0].click();c.copies[0].setAttribute('aria-label','Copié');await Promise.resolve();window.dispatchEvent(new PopStateEvent('popstate'));await wait(30);return status().textContent==='';});
  await check('arrêt busy restitue état natif et retire hooks/status',async()=>{const c=await setup();await startShare(c.share);window[marker].stop();const restored=c.share.matches(':disabled')&&!Object.hasOwn(c.share,'setAttribute')&&!status();await finishShare(c.share);return restored&&!status();});
  await check('réactivation busy bloquée avant handler natif',async()=>{const c=await setup();let calls=0;c.share.addEventListener('click',()=>calls++);await startShare(c.share);c.share.click();await wait(30);const once=calls===1;await finishShare(c.share);return once&&status().textContent===title+' '+privacy;});
  await check('autre copie garde la protection busy puis libère à la fin native',async()=>{const c=await setup();await startShare(c.share);await successfulCopy(c.copies[0]);const preserved=c.share.disabled&&!c.share.hasAttribute('disabled');await finishShare(c.share);return preserved&&document.activeElement===c.copies[0]&&!Object.hasOwn(c.share,'disabled');});
  await check('focus et identité initiaux conservés via setter disabled',async()=>{const c=await setup();c.share.focus();c.share.click();c.share.disabled=true;await wait(30);const retained=document.activeElement===c.share&&c.share.getAttribute('aria-disabled')==='true'&&!c.share.matches(':disabled');c.share.disabled=false;await wait(30);return retained&&document.activeElement===c.share&&!Object.hasOwn(c.share,'setAttribute');});
  await check('nom modèle stable et succès sans mutation secondaire',async()=>{const c=await setup();let names=0;const observer=new MutationObserver(records=>{names+=records.filter(r=>r.attributeName==='aria-label').length;});observer.observe(c.copies[0],{attributes:true});await successfulCopy(c.copies[0]);observer.disconnect();const stable=c.copies[0].getAttribute('aria-label')==='Copier'&&names===0;c.copies[0].setAttribute('aria-label','Copier');return stable&&status().textContent==='Message copié'&&!Object.hasOwn(c.copies[0],'setAttribute');});
  await check('nom utilisateur et réflexion ariaLabel stables',async()=>{const c=await setup();c.copies[1].focus();c.copies[1].click();c.copies[1].ariaLabel='Copié';await wait(30);const held=c.copies[1].ariaLabel==='Copier le message'&&status().textContent==='';c.copies[1].ariaLabel='Copier le message';await wait(550);return held&&status().textContent==='Message copié';});
  await check('succès rapide suivant sans retour transitoire au nom Copié',async()=>{const c=await setup();await successfulCopy(c.copies[0]);let mutations=0;const observer=new MutationObserver(()=>mutations++);observer.observe(status(),{childList:true});await successfulCopy(c.copies[0]);observer.disconnect();return mutations>=2&&c.copies[0].getAttribute('aria-label')==='Copier'&&status().textContent==='Message copié';});
  await check('arrêt copie restitue dernier nom natif',async()=>{const c=await setup();await successfulCopy(c.copies[0]);window[marker].stop();return c.copies[0].getAttribute('aria-label')==='Copié'&&!Object.hasOwn(c.copies[0],'setAttribute')&&!status();});
  await check('icône décorative masquée avant action et remplacement',async()=>{const c=await setup();await wait(20);const first=c.copies[0].querySelector('svg');const before=first.getAttribute('aria-hidden')==='true'&&c.copies[0].getAttribute('aria-hidden')===null;await successfulCopy(c.copies[0]);return before&&first!==c.copies[0].querySelector('svg')&&c.copies[0].querySelector('svg').getAttribute('aria-hidden')==='true'&&status().textContent==='Message copié';});
  await check('retour icône natif, indisponibilité conservée sans sous-arbre occupé',async()=>{const c=await setup();await wait(20);c.copies[0].focus();c.copies[0].click();c.copies[0].setAttribute('aria-busy','true');c.copies[0].setAttribute('aria-disabled','true');await wait(20);const busy=c.copies[0].getAttribute('aria-busy')===null&&c.copies[0].getAttribute('aria-disabled')==='true';c.copies[0].setAttribute('aria-label','Copié');c.copies[0].replaceChildren(icon());await wait(20);c.copies[0].removeAttribute('aria-busy');c.copies[0].removeAttribute('aria-disabled');c.copies[0].setAttribute('aria-label','Copier');c.copies[0].replaceChildren(icon());await wait(20);return busy&&c.copies[0].querySelector('svg').getAttribute('aria-hidden')==='true'&&document.activeElement===c.copies[0];});
  await check('SVG nommé et masquage étranger préservés',async()=>{const c=await setup();const svg=c.copies[0].querySelector('svg');svg.setAttribute('aria-hidden','false');const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent='Information spécifique';svg.append(title);await wait(20);window[marker].stop();return svg.getAttribute('aria-hidden')==='false';});
  await check('arrêt pendant attente copie restitue busy natif',async()=>{const c=await setup();c.copies[0].focus();c.copies[0].click();c.copies[0].ariaBusy='true';c.copies[0].setAttribute('aria-disabled','true');const safe=c.copies[0].ariaBusy===null;window[marker].stop();return safe&&c.copies[0].ariaBusy==='true'&&c.copies[0].getAttribute('aria-disabled')==='true';});
  await check('deux confirmations à 500 ms après succès sans attendre reset',async()=>{for(const index of [0,1]){const c=await setup(),button=c.copies[index];button.focus();button.click();const started=performance.now();button.setAttribute('aria-label','Copié');await wait(350);if(status().textContent!=='')return false;await wait(200);if(status().textContent!=='Message copié'||performance.now()-started<500||!Object.hasOwn(button,'setAttribute'))return false;}return true;});
  await check('autre action annule confirmation utilisateur après reset',async()=>{const c=await setup();c.copies[1].focus();c.copies[1].click();c.copies[1].setAttribute('aria-label','Copié');c.copies[1].setAttribute('aria-label','Copier le message');c.other.click();await wait(550);return status().textContent==='';});
  await check('envoyé indisponible au succès mais focalisable, repeat bloqué, reset réactive',async()=>{const c=await setup(),button=c.copies[1];let calls=0;button.addEventListener('click',()=>{calls++;button.setAttribute('aria-label','Copié');});button.focus();button.click();const exposed=button.getAttribute('aria-disabled')==='true'&&!button.hasAttribute('disabled')&&document.activeElement===button;button.click();await wait(550);const kept=calls===1&&status().textContent==='Message copié';button.setAttribute('aria-label','Copier le message');const restored=button.getAttribute('aria-disabled')===null;button.click();return exposed&&kept&&restored&&calls===2&&document.activeElement===button;});
  await check('arrêt envoyé restitue état false initial sans blur',async()=>{const c=await setup(),button=c.copies[1];button.setAttribute('aria-disabled','false');await successfulCopy(button);const exposed=button.getAttribute('aria-disabled')==='true';window[marker].stop();return exposed&&button.getAttribute('aria-disabled')==='false'&&document.activeElement===button;});
  await check('échec envoyé ne présente pas de faux état indisponible',async()=>{const c=await setup();c.copies[1].focus();c.copies[1].click();await wait(550);return c.copies[1].getAttribute('aria-disabled')===null&&status().textContent==='';});
  await check('écriture étrangère ARIA avant arrêt préservée',async()=>{const c=await setup(),button=c.copies[1];await successfulCopy(button);Element.prototype.setAttribute.call(button,'aria-disabled','true');window[marker].stop();return button.getAttribute('aria-disabled')==='true'&&!Object.hasOwn(button,'ariaDisabled');});
  window[marker]?.stop();
  window.feedbackResults={version:'3.5.6',passed:results.filter(r=>r.ok).length,total:results.length,results};
  document.getElementById('results').textContent=JSON.stringify(window.feedbackResults,null,2);
});
document.getElementById('ax-prepare').addEventListener('click',async()=>{source=await fetch('../../../extension/feedback-actions.js').then(r=>r.text());const c=await setup();c.copies[0].id='ax-copy';window.axCopy=c.copies[0];window.axCopy.addEventListener('click',()=>{window.axCopy.setAttribute('aria-busy','true');window.axCopy.setAttribute('aria-disabled','true');});});
document.getElementById('sender-ax-prepare').addEventListener('click',async()=>{source=await fetch('../../../extension/feedback-actions.js').then(r=>r.text());const c=await setup();c.copies[1].id='ax-sender-copy';window.axSenderCopy=c.copies[1];window.axSenderCopy.addEventListener('click',()=>{window.axSenderCopy.setAttribute('aria-label','Copié');window.axSenderCopy.replaceChildren(icon());});});
window.resetAxSenderCopy=()=>window.axSenderCopy.setAttribute('aria-label','Copier le message');
window.finishAxCopy=()=>{window.axCopy.removeAttribute('aria-busy');window.axCopy.removeAttribute('aria-disabled');window.axCopy.setAttribute('aria-label','Copié');window.axCopy.replaceChildren(icon());};
window.resetAxCopy=()=>{window.axCopy.setAttribute('aria-label','Copier');window.axCopy.replaceChildren(icon());};
</script></body></html>
